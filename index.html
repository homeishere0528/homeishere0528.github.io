<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "Home is Here",
  "alternateName": "ホームイズヒア",

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#d8cfad}
body{overflow-x:hidden}
.seo-intro{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
#opening{
  position:fixed;inset:0;z-index:1000;background:#d8cfad;
  opacity:1;transition:opacity .65s ease
}
#opening.hide{opacity:0;pointer-events:none}
#opening img{width:100%;height:100%;object-fit:cover;display:block}
.home{
  position:relative;min-height:100vh;background:#d8cfad;
  display:flex;align-items:center;justify-content:center
}
.top-image{
  width:100%;height:100vh;min-height:100vh;object-fit:contain;display:block
}
.menu{
  position:absolute;left:50%;bottom:4.5vh;transform:translateX(-50%);
  width:min(720px,86vw);display:flex;justify-content:space-between;gap:24px;z-index:2
}
.menu a{
  color:#111;text-decoration:none;font-family:Georgia,"Times New Roman",serif;
  font-size:12px;letter-spacing:.18em
}
.menu a:hover{opacity:.55}
@media(max-width:700px){
  .menu{width:84vw;bottom:3.5vh;gap:14px}
  .menu a{font-size:10px;letter-spacing:.10em}
}
</style>
</head>
<body>
<div id="opening" aria-hidden="true">
  <img src="opening.jpeg" alt="">
</div>

<main class="home">
  <div class="seo-intro">
    <h1>Home is Here / ホームイズヒア</h1>
    <p>京都を拠点に活動するオルタナティブ／シューゲイザーバンド。Kyoto, Japan based alternative / shoegaze band. Official website for live shows, music, videos and archive.</p>
  </div>
  <img class="top-image" src="top.png" alt="Home is Here">
  <nav class="menu">
    <a href="live.html">LIVE</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="music.html">MUSIC</a>
    <a href="video.html">VIDEO</a>
  </nav>
</main>

<script>
window.addEventListener("load",()=>{
  const opening = document.getElementById("opening");
  const hasSeenOpening = sessionStorage.getItem("hasSeenOpening");

  if (hasSeenOpening) {
    opening.remove();
  } else {
    sessionStorage.setItem("hasSeenOpening", "true");
    setTimeout(()=>{
      opening.classList.add("hide");
      setTimeout(()=>opening.remove(),700);
    },3000);
  }
});
</script>
</body>
</html>
