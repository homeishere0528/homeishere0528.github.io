<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "Home is Here",
  "alternateName": "ホームイズヒア",

  "genre": ["Alternative", "Shoegaze"],

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#d8cfad}
body{overflow-x:hidden}
.site-note-toggle{
  position:fixed;
  top:22px;
  right:24px;
  z-index:20;
  width:24px;
  height:24px;
  padding:0;
  border:0;
  background:transparent;
  color:#111;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-weight:normal;
  line-height:24px;
  cursor:pointer;
  opacity:.78;
  transition:opacity .25s ease, transform .35s ease;
}
.site-note-toggle:hover{opacity:1}
.site-note-toggle[aria-expanded="true"]{transform:rotate(45deg)}

.site-note{
  position:fixed;
  top:55px;
  right:26px;
  z-index:19;
  text-align:right;
  font-family:Georgia,"Times New Roman",serif;
  color:#111;
  pointer-events:none;
}
.site-note-inner{
  opacity:0;
  transform:translate(8px,-5px);
  transition:opacity .4s ease, transform .5s cubic-bezier(.2,.7,.2,1);
}
.site-note.is-open{
  pointer-events:auto;
}
.site-note.is-open .site-note-inner{
  opacity:1;
  transform:translate(0,0);
}
.site-note .identity{
  margin:0;
  font-size:8px;
  line-height:1.65;
  letter-spacing:.13em;
  font-weight:normal;
  text-transform:uppercase;
}
.site-note .jp{
  display:block;
  letter-spacing:.08em;
}
.site-note .place{
  display:block;
  margin-top:1px;
  letter-spacing:.16em;
}
.site-note .socials{
  margin-top:11px;
  font-size:11px;
  line-height:1.9;
  letter-spacing:.09em;
}
.site-note a{
  color:#111;
  text-decoration:none;
}
.site-note a:hover{opacity:.5}

@media(max-width:700px){
  .site-note-toggle{top:14px;right:15px}
  .site-note{top:47px;right:17px}
  .site-note .identity{font-size:7px}
  .site-note .socials{font-size:10px}
}
</style>
</head>
<body>
<div id="opening" aria-hidden="true">
  <img src="opening.jpeg" alt="">
</div>

<main class="home">
  <button class="site-note-toggle" type="button" aria-expanded="false" aria-controls="site-note" aria-label="Open site information">+</button>
  <aside class="site-note" id="site-note" aria-hidden="true">
    <div class="site-note-inner">
      <p class="identity">Home is Here<span class="jp">ホームイズヒア</span><span class="place">Kyoto — Japan</span></p>
      <div class="socials">
        <a href="https://www.instagram.com/homeishere_band/" target="_blank" rel="noopener noreferrer">IG ↗</a><br>
        <a href="https://x.com/homeishere_band" target="_blank" rel="noopener noreferrer">X ↗</a>
      </div>
    </div>
  </aside>
<img class="top-image" src="top.png" alt="Home is Here">
  <nav class="menu">
    <a href="live.html">LIVE</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="music.html">MUSIC</a>
    <a href="video.html">VIDEO</a>
  </nav>
</main>

<script>
window.addEventListener("load",()=>{
  const opening = document.getElementById("opening");
  const hasSeenOpening = sessionStorage.getItem("hasSeenOpening");

  if (hasSeenOpening) {
    opening.remove();
  } else {
    sessionStorage.setItem("hasSeenOpening", "true");
    setTimeout(()=>{
      opening.classList.add("hide");
      setTimeout(()=>opening.remove(),700);
    },3000);
  }
});
</script>

<script>
(() => {
  const toggle = document.querySelector('.site-note-toggle');
  const note = document.querySelector('.site-note');
  if (!toggle || !note) return;

  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') !== 'true';
    toggle.setAttribute('aria-expanded', String(open));
    note.setAttribute('aria-hidden', String(!open));
    note.classList.toggle('is-open', open);
    toggle.setAttribute('aria-label', open ? 'Close site information' : 'Open site information');
  });
})();
</script>

</body>
</html>
