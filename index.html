<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#d8cfad}
body{overflow-x:hidden}
.seo-intro{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
#opening{
  position:fixed;inset:0;z-index:1000;background:#d8cfad;
  opacity:1;transition:opacity .65s ease
}
#opening.hide{opacity:0;pointer-events:none}
#opening img{width:100%;height:100%;object-fit:cover;display:block}
.home{
  position:relative;min-height:100vh;background:#d8cfad;
  display:flex;align-items:center;justify-content:center
}
.top-image{
  width:100%;height:100vh;min-height:100vh;object-fit:contain;display:block
}
.menu{
  position:absolute;left:50%;bottom:4.5vh;transform:translateX(-50%);
  width:min(720px,86vw);display:flex;justify-content:space-between;gap:24px;z-index:2
}
.menu a{
  color:#111;text-decoration:none;font-family:Georgia,"Times New Roman",serif;
  font-size:12px;letter-spacing:.18em
}
.menu a:hover{opacity:.55}
@media(max-width:700px){
  .menu{width:84vw;bottom:3.5vh;gap:14px}
  .menu a{font-size:10px;letter-spacing:.10em}
}

/* Small site-info control added without changing the original layout */
.site-info-toggle{
  position:fixed;
  top:18px;
  right:20px;
  z-index:30;
  padding:0;
  border:0;
  background:transparent;
  color:#111;
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  opacity:.75;
}
.site-info-toggle:hover{opacity:1}

.site-info-panel{
  position:fixed;
  top:43px;
  right:21px;
  z-index:29;
  font-family:Georgia,"Times New Roman",serif;
  text-align:right;
  color:#111;
  opacity:0;
  transform:translateY(-3px);
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.site-info-panel.open{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
.site-info-panel .small{
  margin:0 0 7px;
  font-size:8px;
  line-height:1.5;
  letter-spacing:.06em;
}
.site-info-panel .social{
  font-size:11px;
  line-height:1.7;
  letter-spacing:.05em;
}
.site-info-panel a{
  color:#111;
  text-decoration:none;
}
.site-info-panel a:hover{opacity:.55}

@media(max-width:700px){
  .site-info-toggle{top:14px;right:15px;font-size:16px}
  .site-info-panel{top:38px;right:16px}
  .site-info-panel .small{font-size:7px}
  .site-info-panel .social{font-size:10px}
}

</style>
</head>
<body>

  <button class="site-info-toggle" type="button" aria-expanded="false" aria-label="Site information">+</button>
  <div class="site-info-panel" aria-hidden="true">
    <p class="small">Home is Here / ホームイズヒア<br>Kyoto, Japan</p>
    <div class="social">
      <a href="https://www.instagram.com/homeishere_band/" target="_blank" rel="noopener noreferrer">IG ↗</a><br>
      <a href="https://x.com/homeishere_band" target="_blank" rel="noopener noreferrer">X ↗</a>
    </div>
  </div>

<div id="opening" aria-hidden="true">
  <img src="opening.jpeg" alt="">
</div>

<main class="home">
  <div class="seo-intro">
    <h1>Home is Here / ホームイズヒア</h1>
    <p>京都を拠点に活動するオルタナティブ／シューゲイザーバンド。Kyoto, Japan based alternative / shoegaze band. Official website for live shows, music, videos and archive.</p>
  </div>
  <img class="top-image" src="top.png" alt="Home is Here">
  <nav class="menu">
    <a href="live.html">LIVE</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="music.html">MUSIC</a>
    <a href="video.html">VIDEO</a>
  </nav>
</main>

<script>
window.addEventListener("load",()=>{
  const opening = document.getElementById("opening");
  const hasSeenOpening = sessionStorage.getItem("hasSeenOpening");

  if (hasSeenOpening) {
    opening.remove();
  } else {
    sessionStorage.setItem("hasSeenOpening", "true");
    setTimeout(()=>{
      opening.classList.add("hide");
      setTimeout(()=>opening.remove(),700);
    },3000);
  }
});
</script>

<script>
(() => {
  const button = document.querySelector('.site-info-toggle');
  const panel = document.querySelector('.site-info-panel');
  if (!button || !panel) return;
  button.addEventListener('click', () => {
    const open = !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    button.setAttribute('aria-expanded', String(open));
    panel.setAttribute('aria-hidden', String(!open));
    button.textContent = open ? '×' : '+';
  });
})();
</script>

</body>
</html>
