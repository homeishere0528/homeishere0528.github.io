<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#d8cfad;color:#111;font-family:Arial,Helvetica,sans-serif}
.topbar{
 position:fixed;inset:0 0 auto 0;height:54px;z-index:200;
 display:flex;align-items:center;justify-content:space-between;padding:0 16px;
 pointer-events:none
}
.topbar a,.hint{
 pointer-events:auto;color:#111;text-decoration:none;font-size:9px;
 letter-spacing:.14em;background:rgba(216,207,173,.72);padding:6px 8px
}
.collage{position:fixed;inset:0;overflow:hidden}
.photo{
 position:absolute;padding:0;border:0;background:transparent;cursor:zoom-in;
 transform:translate(-50%,-50%) rotate(var(--r));
 transform-origin:center;transition:transform .12s ease, z-index 0s;
}
.photo img{
 display:block;width:100%;height:auto;pointer-events:none;
 box-shadow:0 1px 5px rgba(0,0,0,.12)
}
.photo:hover{
 transform:translate(-50%,-50%) rotate(0deg) scale(1.14);
 z-index:150!important
}
.viewer{
 position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);
 display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out
}
.viewer.open{display:flex}
.viewer img{max-width:95vw;max-height:94vh;object-fit:contain}
.close{
 position:fixed;top:12px;right:18px;border:0;background:none;color:#fff;
 font-size:32px;cursor:pointer
}

@media (max-width: 760px){
 .topbar{height:48px;padding:0 9px}
 .topbar a,.hint{font-size:8px;padding:5px 6px}
 .photo{width:clamp(85px,16vw,150px)!important}
}
</style>

 <img id="viewerImage" alt="">
</div>

<script>
const viewer=document.getElementById('viewer');
const viewerImage=document.getElementById('viewerImage');

document.querySelectorAll('.photo').forEach(p=>{
 p.addEventListener('click',()=>{
   viewerImage.src=p.dataset.full;
   viewer.classList.add('open');
 });
});
function closeViewer(){
 viewer.classList.remove('open');
 viewerImage.src='';
}
viewer.addEventListener('click',closeViewer);
document.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();closeViewer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
</script>
