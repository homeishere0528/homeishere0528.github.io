<script>
const viewport=document.getElementById('viewport'),world=document.getElementById('world');const WORLD_W=5600,WORLD_H=3900;let scale=Math.max(.56,Math.min(.9,innerWidth/1650));let x=(innerWidth-WORLD_W*scale)/2,y=(innerHeight-WORLD_H*scale)/2;let dragging=false,startX=0,startY=0,baseX=0,baseY=0;
function clamp(){const m=160,minX=innerWidth-WORLD_W*scale-m,maxX=m,minY=innerHeight-WORLD_H*scale-m,maxY=m;x=Math.min(maxX,Math.max(minX,x));y=Math.min(maxY,Math.max(minY,y));}function render(){clamp();world.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function zoomAt(f,cx=innerWidth/2,cy=innerHeight/2){const old=scale;scale=Math.max(.35,Math.min(1.35,scale*f));x=cx-(cx-x)*(scale/old);y=cy-(cy-y)*(scale/old);render()}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.photo'))return;dragging=true;startX=e.clientX;startY=e.clientY;baseX=x;baseY=y;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!dragging)return;x=baseX+e.clientX-startX;y=baseY+e.clientY-startY;render()});viewport.addEventListener('pointerup',()=>{dragging=false;viewport.classList.remove('dragging')});viewport.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoomAt(e.deltaY<0?1.08:.92,e.clientX,e.clientY);else{x-=e.deltaX;y-=e.deltaY;render()}},{passive:false});
document.querySelectorAll('.photo').forEach(p=>{let pd=false,sx=0,sy=0,bx=0,by=0,pm=false;p.addEventListener('pointerdown',e=>{e.preventDefault();pd=true;pm=false;sx=e.clientX;sy=e.clientY;bx=x;by=y;p.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});p.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>5)pm=true;if(pm){x=bx+dx;y=by+dy;render()}});p.addEventListener('pointerup',()=>{pd=false;viewport.classList.remove('dragging');if(!pm)openViewer(p.dataset.src)})});
const viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewerImage');function openViewer(src){viewerImage.src=src;viewer.classList.add('open')}function closeViewer(){viewer.classList.remove('open');viewerImage.src=''}viewer.addEventListener('click',closeViewer);document.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});document.getElementById('plus').onclick=()=>zoomAt(1.15);document.getElementById('minus').onclick=()=>zoomAt(.87);addEventListener('resize',render);render();
</script></body></html>
