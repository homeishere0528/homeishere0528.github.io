<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#d8cfad;color:#111;font-family:Arial,Helvetica,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none
}
.topbar{
  position:fixed;inset:0 0 auto 0;height:66px;z-index:80;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;pointer-events:none
}
.topbar a,.hint{
  pointer-events:auto;color:#111;text-decoration:none;font-size:10px;
  letter-spacing:.15em;background:rgba(216,207,173,.74);padding:7px 9px
}
.viewport{position:fixed;inset:0;overflow:hidden;cursor:grab}
.viewport.dragging{cursor:grabbing}
.world{
  position:absolute;left:0;top:0;width:4000px;height:2450px;
  transform-origin:0 0;will-change:transform;contain:layout paint style
}
.photo{
  position:absolute;padding:0;border:0;background:transparent;cursor:zoom-in;
  transform:rotate(var(--r));transform-origin:center;contain:layout paint;
}
.photo img{
  display:block;width:100%;height:auto;pointer-events:none;
  backface-visibility:hidden;-webkit-backface-visibility:hidden
}
@media(hover:hover){
  .photo:hover{filter:brightness(.94)}
}
.viewer{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out
}
.viewer.open{display:flex}
.viewer img{max-width:95vw;max-height:94vh;object-fit:contain}
.close{
  position:fixed;top:13px;right:18px;border:0;background:none;color:#fff;
  font-size:32px;cursor:pointer
}
.controls{
  position:fixed;right:16px;bottom:14px;z-index:90;display:flex;gap:5px
}
.controls button{
  width:36px;height:36px;border:1px solid rgba(0,0,0,.38);
  background:rgba(216,207,173,.82);font-size:18px;cursor:pointer
}
@media(max-width:700px){
  .topbar{height:56px;padding:0 12px}
  .topbar a,.hint{font-size:9px;padding:6px 7px}
  .controls{right:10px;bottom:10px}
}
</style>

<script>
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const WORLD_W = 4000;
const WORLD_H = 2450;

let scale = Math.max(.48, Math.min(.78, innerWidth / 1700));
let x = (innerWidth - WORLD_W * scale) / 2;
let y = (innerHeight - WORLD_H * scale) / 2;

let targetX = x, targetY = y;
let dragging = false;
let startX = 0, startY = 0, baseX = 0, baseY = 0;
let raf = 0;

function clampTargets() {
  const m = 130;
  const minX = innerWidth - WORLD_W * scale - m;
  const maxX = m;
  const minY = innerHeight - WORLD_H * scale - m;
  const maxY = m;
  targetX = Math.min(maxX, Math.max(minX, targetX));
  targetY = Math.min(maxY, Math.max(minY, targetY));
}

function scheduleRender() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    clampTargets();
    x = targetX;
    y = targetY;
    world.style.transform = `translate3d(${x}px,${y}px,0) scale(${scale})`;
  });
}

function zoomAt(factor, cx=innerWidth/2, cy=innerHeight/2) {
  const old = scale;
  scale = Math.max(.34, Math.min(1.25, scale * factor));
  targetX = cx - (cx - targetX) * (scale / old);
  targetY = cy - (cy - targetY) * (scale / old);
  scheduleRender();
}

function beginDrag(e) {
  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  baseX = targetX;
  baseY = targetY;
  viewport.classList.add('dragging');
  viewport.setPointerCapture?.(e.pointerId);
}

viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.photo')) return;
  beginDrag(e);
});

viewport.addEventListener('pointermove', e => {
  if (!dragging) return;
  targetX = baseX + e.clientX - startX;
  targetY = baseY + e.clientY - startY;
  scheduleRender();
});

function endDrag() {
  dragging = false;
  viewport.classList.remove('dragging');
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    zoomAt(e.deltaY < 0 ? 1.07 : .935, e.clientX, e.clientY);
  } else {
    targetX -= e.deltaX;
    targetY -= e.deltaY;
    scheduleRender();
  }
}, {passive:false});

document.querySelectorAll('.photo').forEach(photo => {
  let down = false, moved = false, sx = 0, sy = 0, bx = 0, by = 0;

  photo.addEventListener('pointerdown', e => {
    e.preventDefault();
    down = true;
    moved = false;
    sx = e.clientX;
    sy = e.clientY;
    bx = targetX;
    by = targetY;
    photo.setPointerCapture?.(e.pointerId);
    viewport.classList.add('dragging');
  });

  photo.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if (Math.hypot(dx,dy) > 7) moved = true;
    if (moved) {
      targetX = bx + dx;
      targetY = by + dy;
      scheduleRender();
    }
  });

  photo.addEventListener('pointerup', () => {
    down = false;
    viewport.classList.remove('dragging');
    if (!moved) openViewer(photo.dataset.full);
  });

  photo.addEventListener('pointercancel', () => {
    down = false;
    viewport.classList.remove('dragging');
  });
});

const viewer = document.getElementById('viewer');
const viewerImage = document.getElementById('viewerImage');

function openViewer(src) {
  viewerImage.src = src;
  viewer.classList.add('open');
}
function closeViewer() {
  viewer.classList.remove('open');
  viewerImage.src = '';
}
viewer.addEventListener('click', closeViewer);
document.querySelector('.close').addEventListener('click', e => {
  e.stopPropagation();
  closeViewer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
});

document.getElementById('plus').onclick = () => zoomAt(1.14);
document.getElementById('minus').onclick = () => zoomAt(.88);

addEventListener('resize', () => {
  scheduleRender();
});

scheduleRender();
</script>
